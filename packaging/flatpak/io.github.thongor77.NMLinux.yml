app-id: io.github.thongor77.NMLinux
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: io.qt.PySide.BaseApp
base-version: '6.11'
command: nmlinux

# The BaseApp already builds PySide6 against this runtime's own Qt, so we
# don't pip-install PySide6 ourselves (avoids a second bundled Qt copy).
# nmlinux doesn't use QtWebEngine or NumPy — drop them to shrink the bundle.
build-options:
  env:
    - BASEAPP_REMOVE_WEBENGINE=1
    - BASEAPP_DISABLE_NUMPY=1
cleanup-commands:
  - /app/cleanup-BaseApp.sh

# nmlinux does no system interaction from inside the sandbox itself: it
# shells out to plain binary names (nmcli, ip, pkexec, ssh, mount.cifs, ...)
# and expects them to act on the real host (NetworkManager, /etc/hosts,
# real mounts). Rather than re-plumbing 30+ call sites, every one of those
# names is shimmed to `flatpak-spawn --host <name> "$@"` — see host-bin/.
# --talk-name=org.freedesktop.Flatpak is what makes flatpak-spawn work.
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Broad on purpose for this first pass: SSH Key Manager reads/writes
  # ~/.ssh, SMB/NFS mounts default under ~/mnt, exports go wherever the
  # user picks in a file dialog. Portal-based FileChooser + narrower
  # filesystem grants are a follow-up if this ever targets Flathub.
  - --filesystem=home
  - --talk-name=org.freedesktop.Flatpak
  - --env=PATH=/app/bin/host-bin:/app/bin:/usr/bin

modules:
  # Offline-installable pip sources for ptyprocess, pyte, tftpy and
  # hatchling (build backend) — generated with:
  #   uv run --with pyyaml flatpak-pip-generator.py --yaml \
  #     --output python3-requirements ptyprocess pyte tftpy hatchling
  # Re-run and commit the result whenever pyproject.toml's dependencies
  # change. PySide6 is NOT in this list — it comes from the BaseApp.
  - name: python3-requirements
    buildsystem: simple
    build-commands: []
    modules:
      - name: python3-ptyprocess
        buildsystem: simple
        build-commands:
          - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
            --prefix=${FLATPAK_DEST} "ptyprocess" --no-build-isolation
        sources:
          - type: file
            url: https://files.pythonhosted.org/packages/22/a6/858897256d0deac81a172289110f31629fc4cee19b6f01283303e18c8db3/ptyprocess-0.7.0-py2.py3-none-any.whl
            sha256: 4b41f3967fce3af57cc7e94b888626c18bf37a083e3651ca8feeb66d492fef35
      - name: python3-pyte
        buildsystem: simple
        build-commands:
          - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
            --prefix=${FLATPAK_DEST} "pyte" --no-build-isolation
        sources:
          - type: file
            url: https://files.pythonhosted.org/packages/59/d0/bb522283b90853afbf506cd5b71c650cf708829914efd0003d615cf426cd/pyte-0.8.2-py3-none-any.whl
            sha256: 85db42a35798a5aafa96ac4d8da78b090b2c933248819157fc0e6f78876a0135
          - type: file
            url: https://files.pythonhosted.org/packages/96/42/3e5985a0a7e57de470b320c6d6a1a67c844f6737a587f3d44dd13d1819e7/wcwidth-0.8.2-py3-none-any.whl
            sha256: d63947694a0539a1d51e01eda7caf800c291020e6cdd7e28ad7b14dd33ad4f85
      - name: python3-tftpy
        buildsystem: simple
        build-commands:
          - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
            --prefix=${FLATPAK_DEST} "tftpy" --no-build-isolation
        sources:
          - type: file
            url: https://files.pythonhosted.org/packages/11/87/83b028117ecd2d988b10884c78c798d3bffc0a8ecb9645b03aecffe2637f/tftpy-0.8.7-py3-none-any.whl
            sha256: 59289b269ed6e0a7c8762301f99b56814026758b3137a90c9c3e677881efc853
      - name: python3-hatchling
        buildsystem: simple
        build-commands:
          - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
            --prefix=${FLATPAK_DEST} "hatchling" --no-build-isolation
        sources:
          - type: file
            url: https://files.pythonhosted.org/packages/64/e2/2c0af0a52d16be74a4f194564fcdc417521ed863e9b65e4bc9052dacba6f/hatchling-1.31.0-py3-none-any.whl
            sha256: aac80bec8b6fe35e8480f1c335be8910fa210a0e6f735a139be205dadcacb544
          - type: file
            url: https://files.pythonhosted.org/packages/f1/d9/7fb5aa316bc299258e68c73ba3bddbc499654a07f151cba08f6153988714/pathspec-1.1.1-py3-none-any.whl
            sha256: a00ce642f577bf7f473932318056212bc4f8bfdf53128c78bbd5af0b9b20b189
          - type: file
            url: https://files.pythonhosted.org/packages/54/20/4d324d65cc6d9205fabedc306948156824eb9f0ee1633355a8f7ec5c66bf/pluggy-1.6.0-py3-none-any.whl
            sha256: e920276dd6813095e9377c0bc5566d94c932c33b27a3e3945d8389c374dd4746
          - type: file
            url: https://files.pythonhosted.org/packages/7c/a4/81502f486f01db95bc8320646a8a12511f5e556cb63d5e224d91816605c4/trove_classifiers-2026.6.1.19-py3-none-any.whl
            sha256: ab4c4ec93cc4a4e7815fa759906e05e6bb3f2fbd92ea0f897288c6a43efd15b3

  - name: nmlinux
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --no-build-isolation --prefix=${FLATPAK_DEST} .
      - install -Dm755 packaging/flatpak/host-bin/host-spawn
        ${FLATPAK_DEST}/bin/host-bin/host-spawn
      - |
        for f in packaging/flatpak/host-bin/*; do
          name=$(basename "$f")
          [ "$name" = "host-spawn" ] && continue
          ln -sf host-spawn "${FLATPAK_DEST}/bin/host-bin/$name"
        done
      - install -Dm644 packaging/flatpak/io.github.thongor77.NMLinux.desktop
        ${FLATPAK_DEST}/share/applications/io.github.thongor77.NMLinux.desktop
      - install -Dm644 packaging/nmlinux_icon.svg
        ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/io.github.thongor77.NMLinux.svg
    sources:
      - type: dir
        path: ../..
